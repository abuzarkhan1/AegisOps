server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ${SERVICE_NAME:notification-service}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:aegisops}
    password: ${RABBITMQ_PASSWORD:aegisops}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      service: ${SERVICE_NAME:notification-service}

