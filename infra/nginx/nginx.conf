events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream web_dashboard {
    server host.docker.internal:5173;
  }

  upstream core_api {
    server host.docker.internal:4000;
  }

  upstream log_ingester {
    server host.docker.internal:5001;
  }

  upstream metrics_service {
    server host.docker.internal:5002;
  }

  upstream ai_rca_service {
    server host.docker.internal:8000;
  }

  upstream notification_service {
    server host.docker.internal:8085;
  }

  upstream deployment_tracker {
    server host.docker.internal:4010;
  }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"nginx","message":"AegisOps gateway healthy"}';
    }

    location /api/ {
      proxy_pass http://core_api;
    }

    location /ingest/ {
      rewrite ^/ingest/?(.*)$ /$1 break;
      proxy_pass http://log_ingester;
    }

    location /metrics-api/ {
      rewrite ^/metrics-api/?(.*)$ /$1 break;
      proxy_pass http://metrics_service;
    }

    location /ai/ {
      rewrite ^/ai/?(.*)$ /$1 break;
      proxy_pass http://ai_rca_service;
    }

    location /notify/ {
      rewrite ^/notify/?(.*)$ /$1 break;
      proxy_pass http://notification_service;
    }

    location /deployments/ {
      proxy_pass http://deployment_tracker;
    }

    location = /deployments {
      proxy_pass http://deployment_tracker/deployments;
    }

    location / {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://web_dashboard;
    }
  }
}
